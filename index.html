<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPTUK HTPN e-CLINICAL PORTAL</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cobalt: { 600: '#1d4ed8', 700: '#1e40af', 800: '#1e3a8a', 900: '#0f172a' },
                        sepia: { 50: '#fdfbf7', 100: '#f4ebd0', 400: '#d4b996', 800: '#5c4033', 900: '#3d2817' },
                        cream: { 50: '#fffbf0', 100: '#fef3d6' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Courier New', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        canvas.signature-pad {
            touch-action: none;
            background: #ffffff;
            cursor: crosshair;
        }
    </style>
</head>
<body class="bg-sepia-50 text-sepia-900 min-h-screen flex flex-col justify-between">

    <!-- Top Navigation / Header -->
    <header class="bg-cobalt-900 text-white shadow-md border-b-4 border-amber-500">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 text-cobalt-900 p-2.5 rounded-lg font-bold text-xl shadow">
                    <i class="fas fa-stethoscope"></i>
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-bold tracking-tight">PPTUK HTPN e-CLINICAL PORTAL</h1>
                    <p class="text-xs text-amber-200" data-i18n="appSub"></p>
                </div>
            </div>

            <!-- Language toggle, user info & login/logout -->
            <div class="flex items-center gap-3">
                <button id="lang_toggle_btn" onclick="toggleLanguage()" title="Language / Bahasa"
                        class="px-3 py-2 bg-white/10 hover:bg-white/20 text-white font-bold text-xs rounded border border-white/30 transition flex items-center gap-2">
                    <i class="fas fa-language"></i> <span data-i18n="langBtn"></span>
                </button>
                <div id="nav_user_badge" class="hidden items-center gap-2 bg-cobalt-800 px-3 py-1.5 rounded-full text-xs font-mono border border-cobalt-600">
                    <i class="fas fa-user-shield text-amber-400"></i>
                    <span id="nav_display_name"></span>
                </div>
                <button id="nav_auth_btn" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-cobalt-900 font-bold text-xs rounded shadow transition flex items-center gap-2">
                    <i class="fas fa-sign-in-alt"></i> <span id="auth_btn_label"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">

        <!-- VIEW 1: LOGIN -->
        <div id="view_login" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-sepia-100 my-12">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-cobalt-900 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow">
                    <i class="fas fa-lock"></i>
                </div>
                <h2 class="text-xl font-bold text-cobalt-900" data-i18n="loginTitle"></h2>
                <p class="text-xs text-gray-500 mt-1" data-i18n="loginSub"></p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1" data-i18n="userId"></label>
                    <input type="text" id="login_user_id" required data-i18n-ph="userIdPh"
                           class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-cobalt-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1" data-i18n="password"></label>
                    <input type="password" id="login_password" required data-i18n-ph="passwordPh"
                           class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-cobalt-600 focus:outline-none">
                </div>
                <button type="submit" id="login_submit_btn" class="w-full py-3 bg-cobalt-900 hover:bg-cobalt-800 text-white font-bold rounded-lg shadow transition text-sm disabled:opacity-60" data-i18n="loginBtn"></button>
            </form>
            <div class="mt-6 p-3 bg-amber-50 border border-amber-200 rounded text-xs text-amber-900">
                <p class="font-bold"><i class="fas fa-info-circle mr-1"></i> <span data-i18n="noteTitle"></span></p>
                <p class="mt-1" data-i18n="noteBody"></p>
            </div>
        </div>

        <!-- VIEW 2: OFFICER PORTAL -->
        <div id="view_officer_portal" class="hidden space-y-6">

            <!-- Officer Welcome Banner -->
            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-cobalt-600 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded" data-i18n="officerPortal"></span>
                    <h2 id="welcome_officer_name" class="text-xl font-bold text-cobalt-900 mt-1"></h2>
                    <p class="text-xs text-gray-500" data-i18n="officerSub"></p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <div class="flex items-center gap-2 mr-2">
                        <label for="report_month_select" class="text-[11px] font-bold text-gray-600" data-i18n="month"></label>
                        <select id="report_month_select" onchange="onMonthChange()" class="p-2 text-xs border rounded bg-white font-bold"></select>
                    </div>
                    <button onclick="switchTab('attendance')" id="btn_tab_att" class="px-4 py-2 bg-cobalt-900 text-white font-bold text-xs rounded shadow">
                        <i class="fas fa-clipboard-check mr-1"></i> <span data-i18n="tabAtt"></span>
                    </button>
                    <button onclick="switchTab('logbook')" id="btn_tab_lb" class="px-4 py-2 bg-gray-200 text-gray-700 font-bold text-xs rounded hover:bg-gray-300 transition">
                        <i class="fas fa-book mr-1"></i> <span data-i18n="tabLb"></span>
                    </button>
                </div>
            </div>

            <!-- TAB A: ATTENDANCE LOG -->
            <div id="tab_content_attendance" class="space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                    <!-- Left: Attendance Form -->
                    <div class="bg-white p-6 rounded-xl shadow border border-sepia-100 lg:col-span-1 space-y-4">
                        <div class="border-b pb-3">
                            <h3 class="font-bold text-cobalt-900 text-sm flex items-center gap-2">
                                <i class="fas fa-user-clock text-amber-500"></i> <span data-i18n="newSession"></span>
                            </h3>
                            <p class="text-xs text-gray-500 mt-0.5" data-i18n="newSessionSub"></p>
                        </div>

                        <form id="attendance_form" onsubmit="handleAttendanceSubmit(event)" class="space-y-3 text-xs">
                            <div>
                                <label class="block font-bold text-gray-700 mb-1" data-i18n="dutyDate"></label>
                                <input type="date" id="att_date" required class="w-full p-2 border rounded">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block font-bold text-gray-700 mb-1" data-i18n="start"></label>
                                    <input type="time" id="att_start" value="08:00" required oninput="autoCalcHours()" class="w-full p-2 border rounded">
                                </div>
                                <div>
                                    <label class="block font-bold text-gray-700 mb-1" data-i18n="end"></label>
                                    <input type="time" id="att_end" value="13:00" required oninput="autoCalcHours()" class="w-full p-2 border rounded">
                                </div>
                            </div>
                            <div>
                                <label class="block font-bold text-gray-700 mb-1" data-i18n="clinicalHours"></label>
                                <input type="number" step="0.25" min="0.25" max="24" id="att_hours" value="5" required class="w-full p-2 border rounded bg-gray-50 font-bold text-cobalt-900">
                            </div>
                            <div>
                                <label class="block font-bold text-gray-700 mb-1" data-i18n="activity"></label>
                                <!-- Option values stay in Malay: they are what gets saved to the sheet and PDF -->
                                <select id="att_activity" class="w-full p-2 border rounded">
                                    <option value="3.1 Klinik Pakar / Pesakit Luar" data-i18n="act31"></option>
                                    <option value="3.2 Pengurusan Pesakit Wad & Discaj" data-i18n="act32"></option>
                                    <option value="3.3 Jabatan Kecemasan & Trauma" data-i18n="act33"></option>
                                    <option value="Aktiviti Klinikal Lain (Customized)" data-i18n="actOther"></option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold text-gray-700 mb-1">
                                    <span data-i18n="details"></span> <span class="font-normal text-gray-400" data-i18n="optional"></span>
                                </label>
                                <textarea id="att_details" rows="2" data-i18n-ph="detailsPh" class="w-full p-2 border rounded"></textarea>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block font-bold text-gray-700 mb-1" data-i18n="supName"></label>
                                    <input type="text" id="att_supervisor" data-i18n-ph="supNamePh" required class="w-full p-2 border rounded">
                                </div>
                                <div>
                                    <label class="block font-bold text-gray-700 mb-1" data-i18n="supRole"></label>
                                    <input type="text" id="att_sup_role" data-i18n-ph="supRolePh" required class="w-full p-2 border rounded">
                                </div>
                            </div>

                            <!-- Touchscreen Finger Signature Pad -->
                            <div>
                                <label class="block font-bold text-gray-700 mb-1 flex justify-between items-center">
                                    <span data-i18n="sigLabel"></span>
                                    <button type="button" onclick="pads.att.clear()" class="text-red-600 hover:underline text-[10px]" data-i18n="clear"></button>
                                </label>
                                <div class="border rounded bg-white overflow-hidden">
                                    <canvas id="signature_canvas" class="signature-pad w-full h-28"></canvas>
                                </div>
                                <p class="text-[10px] text-gray-500 mt-1" data-i18n="sigHint"></p>
                            </div>

                            <button type="submit" id="att_submit_btn" class="w-full py-2.5 bg-cobalt-900 hover:bg-cobalt-800 text-white font-bold rounded shadow transition disabled:opacity-60">
                                <i class="fas fa-check-circle mr-1"></i> <span data-i18n="saveSession"></span>
                            </button>
                        </form>
                    </div>

                    <!-- Right: Recorded Sessions Table -->
                    <div class="bg-white p-6 rounded-xl shadow border border-sepia-100 lg:col-span-2 space-y-4">
                        <div class="flex justify-between items-center border-b pb-3">
                            <div>
                                <h3 class="font-bold text-cobalt-900 text-sm" data-i18n="sessionsTitle"></h3>
                                <p class="text-xs text-gray-500"><span data-i18n="sessionsSub"></span> <b id="att_month_label"></b>.</p>
                            </div>
                            <span id="att_count_badge" class="bg-green-100 text-green-800 text-xs font-bold px-2.5 py-1 rounded"></span>
                        </div>

                        <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead class="bg-gray-100 sticky top-0 text-gray-700 uppercase">
                                    <tr>
                                        <th class="p-2 border" data-i18n="thDate"></th>
                                        <th class="p-2 border" data-i18n="thTime"></th>
                                        <th class="p-2 border" data-i18n="thActivity"></th>
                                        <th class="p-2 border" data-i18n="thSupervisor"></th>
                                        <th class="p-2 border" data-i18n="thSignature"></th>
                                        <th class="p-2 border text-center" data-i18n="thAction"></th>
                                    </tr>
                                </thead>
                                <tbody id="attendance_table_body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB B: MONTHLY LOG BOOK & SUBMISSION TO TDP 1 -->
            <div id="tab_content_logbook" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow border border-sepia-100 space-y-6">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-4 gap-4">
                        <div>
                            <h3 class="font-bold text-cobalt-900 text-base" data-i18n="lbTitle"></h3>
                            <p class="text-xs text-gray-500" data-i18n="lbSub"></p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-gray-600"><span data-i18n="reportMonth"></span> <b id="lb_month_label">-</b></span>
                            <button onclick="loadMySessions()" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-xs font-bold rounded">
                                <i class="fas fa-sync-alt"></i> <span data-i18n="refresh"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Summary Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg">
                            <p class="text-xs text-blue-700 font-bold uppercase" data-i18n="totalSessions"></p>
                            <p id="sum_total_sessions" class="text-2xl font-black text-blue-900 mt-1">0</p>
                        </div>
                        <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-lg">
                            <p class="text-xs text-indigo-700 font-bold uppercase" data-i18n="totalHours"></p>
                            <p id="sum_total_hours" class="text-2xl font-black text-indigo-900 mt-1">0.0</p>
                        </div>
                        <div class="bg-amber-50 border border-amber-200 p-4 rounded-lg">
                            <p class="text-xs text-amber-800 font-bold uppercase" data-i18n="target"></p>
                            <p id="sum_compliance_pct" class="text-2xl font-black text-amber-900 mt-1">0.0%</p>
                        </div>
                        <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-lg">
                            <p class="text-xs text-emerald-700 font-bold uppercase" data-i18n="complianceStatus"></p>
                            <p id="sum_status_text" class="text-sm font-bold text-emerald-900 mt-2"></p>
                        </div>
                    </div>

                    <!-- Submission Action -->
                    <div class="bg-cream-50 border-2 border-dashed border-amber-400 p-6 rounded-xl flex flex-col md:flex-row items-center justify-between gap-4">
                        <div>
                            <h4 class="font-bold text-sepia-900 text-sm" data-i18n="submitTitle"></h4>
                            <p class="text-xs text-gray-600 mt-1" data-i18n-html="submitSub"></p>

                            <!-- Officer's initial / signature for the Lampiran A PDF -->
                            <div class="mt-4 max-w-sm text-xs">
                                <label class="font-bold text-gray-700 mb-1 flex justify-between items-center">
                                    <span data-i18n="lbSigLabel"></span>
                                    <button type="button" onclick="pads.lb.clear()" class="text-red-600 hover:underline text-[10px]" data-i18n="clear"></button>
                                </label>
                                <div class="border rounded bg-white overflow-hidden">
                                    <canvas id="lb_signature_canvas" class="signature-pad w-full h-24"></canvas>
                                </div>
                                <p class="text-[10px] text-gray-500 mt-1" data-i18n="lbSigHint"></p>
                            </div>
                        </div>
                        <button onclick="submitLogbookToDeputyDirector()" id="lb_submit_btn" class="px-6 py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs rounded-lg shadow transition flex items-center gap-2 whitespace-nowrap disabled:opacity-60">
                            <i class="fas fa-paper-plane"></i> <span data-i18n="submitBtn"></span>
                        </button>
                    </div>

                    <!-- Officer's own submission history -->
                    <div class="space-y-2">
                        <h4 class="font-bold text-cobalt-900 text-sm" data-i18n="historyTitle"></h4>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead class="bg-gray-100 text-gray-700 uppercase">
                                    <tr>
                                        <th class="p-2 border" data-i18n="thDateTime"></th>
                                        <th class="p-2 border" data-i18n="thMonth"></th>
                                        <th class="p-2 border" data-i18n="thSessions"></th>
                                        <th class="p-2 border" data-i18n="thHours"></th>
                                        <th class="p-2 border" data-i18n="thAchievement"></th>
                                        <th class="p-2 border text-center">PDF</th>
                                    </tr>
                                </thead>
                                <tbody id="my_submissions_table_body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- VIEW 3: ADMIN DASHBOARD -->
        <div id="view_admin_dashboard" class="hidden space-y-6">
            <div class="bg-cobalt-900 text-white p-6 rounded-xl shadow flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span class="bg-amber-500 text-cobalt-900 text-xs font-bold px-2.5 py-1 rounded uppercase" data-i18n="adminBadge"></span>
                    <h2 class="text-xl font-bold mt-1" data-i18n="adminTitle"></h2>
                    <p class="text-xs text-amber-200" data-i18n="adminEmail"></p>
                </div>
                <div class="flex items-center gap-2">
                    <select id="admin_month_filter" onchange="renderAdminTable()" class="p-2 text-xs rounded text-cobalt-900 font-bold"></select>
                    <button onclick="loadAdminData()" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white text-xs font-bold rounded border border-white/20 transition">
                        <i class="fas fa-sync-alt mr-1"></i> <span data-i18n="reloadData"></span>
                    </button>
                </div>
            </div>

            <!-- Admin Stats Overview -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow border">
                    <p class="text-xs text-gray-500 font-bold uppercase" data-i18n="reportsReceived"></p>
                    <p id="admin_total_reports" class="text-3xl font-black text-cobalt-900 mt-2">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border">
                    <p class="text-xs text-gray-500 font-bold uppercase" data-i18n="compliantCount"></p>
                    <p id="admin_compliant_count" class="text-3xl font-black text-emerald-600 mt-2">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border">
                    <p class="text-xs text-gray-500 font-bold uppercase" data-i18n="notCompliantCount"></p>
                    <p id="admin_noncompliant_count" class="text-3xl font-black text-red-600 mt-2">0</p>
                </div>
            </div>

            <!-- Admin Submissions Table -->
            <div class="bg-white p-6 rounded-xl shadow border space-y-4">
                <h3 class="font-bold text-cobalt-900 text-sm" data-i18n="adminTableTitle"></h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead class="bg-gray-100 text-gray-700 uppercase">
                            <tr>
                                <th class="p-3 border" data-i18n="thDateTime"></th>
                                <th class="p-3 border" data-i18n="thOfficerId"></th>
                                <th class="p-3 border" data-i18n="thOfficerName"></th>
                                <th class="p-3 border" data-i18n="thMonth"></th>
                                <th class="p-3 border" data-i18n="thHours"></th>
                                <th class="p-3 border" data-i18n="thAchievement"></th>
                                <th class="p-3 border" data-i18n="thStatus"></th>
                                <th class="p-3 border text-center" data-i18n="thPdf"></th>
                            </tr>
                        </thead>
                        <tbody id="admin_submissions_table_body"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500 mt-12">
        <p>PPTUK HTPN e-CLINICAL PORTAL &copy; 2026 | <span data-i18n="footerOrg"></span></p>
        <p class="text-[10px] text-gray-400 mt-1" data-i18n="footerSupport"></p>
    </footer>

    <!-- Notification Modal -->
    <div id="modal_notification" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white max-w-sm w-full p-6 rounded-xl shadow-xl text-center space-y-4">
            <div id="modal_icon" class="w-12 h-12 rounded-full flex items-center justify-center mx-auto text-xl"></div>
            <h3 id="modal_title" class="font-bold text-gray-900 text-base"></h3>
            <p id="modal_message" class="text-xs text-gray-600"></p>
            <button onclick="closeModal()" class="w-full py-2.5 bg-cobalt-900 text-white font-bold rounded text-xs">OK</button>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // ================= Configuration =================
        const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbwhctKM55yVR3u7xg15jka-w8zxwljhBpYkA56NWvFppJ4DYB95Wli8vrxyoaLVCHPAMw/exec";
        const STANDARD_MONTHLY_HOURS = 160;
        const MONTHS = {
            ms: ["Januari", "Februari", "Mac", "April", "Mei", "Jun", "Julai", "Ogos", "September", "Oktober", "November", "Disember"],
            en: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
        };

        // ================= Translations (Bahasa Melayu / English) =================
        const I18N = {
            ms: {
                langBtn: "English",
                appSub: "Jabatan Kesihatan Negeri Selangor | Portal Rasmi Tugas Klinikal",
                login: "Log Masuk", logout: "Log Keluar",
                loginTitle: "Log Masuk Portal PPTUK",
                loginSub: "Sila masukkan ID Pengguna & kata laluan yang diberikan.",
                userId: "ID Pengguna", userIdPh: "Masukkan ID Pengguna",
                password: "Kata Laluan", passwordPh: "Masukkan kata laluan",
                loginBtn: "Log Masuk Portal",
                noteTitle: "Nota Penting:",
                noteBody: "Gunakan ID unik pegawai anda (cth: dr_ita) dan kata laluan yang diberikan oleh Pejabat TDP 1.",
                officerPortal: "Portal Pegawai Perubatan (PPTUK)",
                officerSub: "Hantar sehingga 4+ rekod sesi kehadiran seminggu & jana Log Book bulanan kepada TDP 1.",
                month: "Bulan:",
                tabAtt: "Log Kehadiran (Sesi)",
                tabLb: "Log Book & Hantar (Lampiran A)",
                newSession: "Rekod Sesi Tugas Klinikal Baru",
                newSessionSub: "Isi setiap kali anda bertugas klinikal (hingga 4x seminggu).",
                dutyDate: "Tarikh Bertugas", start: "Mula", end: "Tamat",
                clinicalHours: "Jumlah Jam Klinikal",
                activity: "Kategori Aktiviti (Skop)",
                act31: "3.1 Klinik Pakar / Pesakit Luar",

        function safeUrl(u) {

        /** "2026-11" -> Malay label "November 2026" (the format stored in the sheet). */
        function monthLabelMs(key) {
            const [y, m] = key.split('-');
            return `${MONTHS.ms[parseInt(m, 10) - 1]} ${y}`;

        /** "2026-11" -> label in the current language. */

        /** POST to Apps Script. Body is sent as text/plain to avoid a CORS preflight. */
        async function api(action, params = {}) {
            let res;
            try {
                const r = await fetch(DEFAULT_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(Object.assign({ action, token: authToken }, params))
                });
                res = await r.json();
            } catch (err) {
                throw new Error(t('connError'));
            }
            if (res.status === "AUTH") {
                clearSession();
                renderApp();
                throw new Error(translateBackendMsg(res.message));
            }
            if (res.status !== "SUCCESS") throw new Error(translateBackendMsg(res.message) || t('unknownError'));
            return res;
        }

        // ================= Signature Pads =================
        /** Create a touch/mouse signature pad on a canvas. Returns helpers for that pad. */
        function createSignaturePad(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let drawing = false, signed = false;

            /** Match the canvas resolution to its on-screen size. Must run while the canvas is visible. */
            function resize() {
                if (canvas.offsetWidth === 0) return;
                const ratio = window.devicePixelRatio || 1;
                const w = Math.round(canvas.offsetWidth * ratio);
                const h = Math.round(canvas.offsetHeight * ratio);
                if (canvas.width === w && canvas.height === h) return;
                canvas.width = w;
                canvas.height = h;
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                ctx.lineWidth = 2;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#0f172a';
                signed = false; // resizing clears the canvas
            }
            function pos(e) {
                const rect = canvas.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            }
            function start(e) {
                resize();
                drawing = true;
                const p = pos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }
            function move(e) {
                if (!drawing) return;
                const p = pos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                signed = true;
            }
            function stop() { drawing = false; }
            function clear() {
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
                signed = false;
            }
            /** Export at on-screen size (not device-pixel size) to keep the PNG small. */
            function toDataURL() {
                const out = document.createElement('canvas');
                out.width = canvas.offsetWidth;
                out.height = canvas.offsetHeight;
                out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
                return out.toDataURL('image/png');
            }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseleave', stop);
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); start(e.touches[0]); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); move(e.touches[0]); }, { passive: false });
            canvas.addEventListener('touchend', (e) => { e.preventDefault(); stop(); }, { passive: false });
            window.addEventListener('resize', resize);

            return { resize, clear, toDataURL, isSigned: () => signed };
        }


        // ================= Attendance =================
        function autoCalcHours() {
            const s = document.getElementById('att_start').value;
            const e = document.getElementById('att_end').value;
            if (!s || !e) return;
            const [sh, sm] = s.split(':').map(Number);
            const [eh, em] = e.split(':').map(Number);
            let mins = (eh * 60 + em) - (sh * 60 + sm);
            if (mins <= 0) mins += 24 * 60; // shift past midnight
            document.getElementById('att_hours').value = Math.round(mins / 15) * 0.25;
        }

        async function handleAttendanceSubmit(e) {
            e.preventDefault();
            if (!pads.att.isSigned()) {
                showModal(t('warning'), t('needSig'), "warning");
                return;
            }
            const hours = parseFloat(document.getElementById('att_hours').value);
            if (!(hours > 0 && hours <= 24)) {
                showModal(t('warning'), t('badHours'), "warning");
                return;
            }
            const data = {
                date: document.getElementById('att_date').value,
                startTime: document.getElementById('att_start').value,
                endTime: document.getElementById('att_end').value,
                hours,
                activityType: document.getElementById('att_activity').value,
                details: document.getElementById('att_details').value.trim(),
                supervisorName: document.getElementById('att_supervisor').value.trim(),
                supervisorRole: document.getElementById('att_sup_role').value.trim(),
                signatureData: pads.att.toDataURL()
            };

            setBusy('att_submit_btn', true);
            try {
                await api("LOG_ATTENDANCE", { data });
                document.getElementById('attendance_form').reset();
                document.getElementById('att_date').value = todayIso();
                pads.att.clear();

                // Jump to the month of the session just saved, if it is in the list
                const key = data.date.substring(0, 7);
                const sel = document.getElementById('report_month_select');
                if ([...sel.options].some(o => o.value === key)) sel.value = key;
                await loadMySessions();
                showModal(t('success'), t('sessionSaved'), "success");
            } catch (err) {
                showModal(t('error'), err.message, "error");
            } finally {
                setBusy('att_submit_btn', false);
            }
        }

        async function loadMySessions() {
            const month = selectedMonth();
            updateMonthLabels();
            document.getElementById('attendance_table_body').innerHTML =
                `<tr><td colspan="6" class="p-6 text-center text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i> ${esc(t('loadingSessions'))}</td></tr>`;
            try {
                const res = await api("GET_MY_SESSIONS", { month });
                if (month !== selectedMonth()) return; // user changed month meanwhile
                attendanceSessions = res.sessions;
            } catch (err) {
                attendanceSessions = [];
                if (currentUser) showModal(t('error'), err.message, "error");
            }
            renderAttendanceTable();
            recalculateLogbook();
        }

        function signatureCell(s) {
            const img = String(s.signatureImg || "");
            if (img.indexOf("data:image/png;base64,") === 0) {
                return `<img src="${esc(img)}" alt="${esc(t('thSignature'))}" class="h-10 max-w-[140px] object-contain bg-white">`;
            }
            if (s.signatureRef && s.signatureRef !== "None") {
                return `<span class="text-emerald-700 font-bold"><i class="fas fa-signature mr-1"></i>${esc(t('signed'))}</span>`;
            }
            return '-';
        }

        function renderAttendanceTable() {
            const tbody = document.getElementById('attendance_table_body');
            document.getElementById('att_count_badge').innerText = t('sessionsCount', { n: attendanceSessions.length });

            if (attendanceSessions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-400 italic">${esc(t('noSessions'))}</td></tr>`;
                return;
            }
            tbody.innerHTML = attendanceSessions.map(s => {
                const actKey = ACTIVITY_KEYS[s.activityType];
                return `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-2 border">${esc(s.date)}</td>
                    <td class="p-2 border">${esc(s.startTime)} - ${esc(s.endTime)}<br><b>${esc(s.hours)} ${esc(t('hoursUnit'))}</b></td>
                    <td class="p-2 border"><b>${esc(actKey ? t(actKey) : s.activityType)}</b>${s.details ? `<br><small class="text-gray-500">${esc(s.details)}</small>` : ''}</td>
                    <td class="p-2 border">${esc(s.supervisorName)}<br><small class="text-gray-500">${esc(s.supervisorRole)}</small></td>
                    <td class="p-2 border">${signatureCell(s)}</td>
                    <td class="p-2 border text-center">
                        <button onclick="deleteSession('${esc(s.sessionId)}')" title="${esc(t('deleteSession'))}" class="text-red-600 hover:text-red-800 p-1"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        async function deleteSession(sessionId) {
            if (!confirm(t('confirmDelete'))) return;
            try {
                await api("DELETE_SESSION", { sessionId });
                await loadMySessions();
            } catch (err) {
                showModal(t('error'), err.message, "error");
            }
        }

        // ================= Logbook =================
        function recalculateLogbook() {
            const totalHours = attendanceSessions.reduce((sum, s) => sum + (parseFloat(s.hours) || 0), 0);
            const percentage = (totalHours / STANDARD_MONTHLY_HOURS) * 100;

            document.getElementById('sum_total_sessions').innerText = attendanceSessions.length;
            document.getElementById('sum_total_hours').innerText = totalHours.toFixed(1) + " " + t('hoursUnit');
            document.getElementById('sum_compliance_pct').innerText = percentage.toFixed(1) + "%";

            const statusEl = document.getElementById('sum_status_text');
            if (attendanceSessions.length === 0) {
                statusEl.innerText = t('waiting');
                statusEl.className = "text-sm font-bold text-gray-500 mt-2";
            } else if (percentage >= 30) {
                statusEl.innerText = t('compliant');
                statusEl.className = "text-sm font-bold text-emerald-700 mt-2";
            } else {
                statusEl.innerText = t('notCompliant');
                statusEl.className = "text-sm font-bold text-red-600 mt-2";
            }
        }

        async function submitLogbookToDeputyDirector() {
            const month = selectedMonth();
            if (attendanceSessions.length === 0) {
                showModal(t('warning'), t('noSessionsForMonth', { month: monthLabel(month) }), "warning");
                return;
            }
            if (!pads.lb.isSigned()) {
                showModal(t('warning'), t('needLbSig'), "warning");
                return;
            }
            const already = mySubmissions.some(s => s.month === monthLabelMs(month));
            const msg = already
                ? t('confirmResubmit', { month: monthLabel(month) })
                : t('confirmSubmit', { month: monthLabel(month), n: attendanceSessions.length });
            if (!confirm(msg)) return;

            setBusy('lb_submit_btn', true);
            showModal(t('processing'), t('processingMsg'), "info");
            try {
                const res = await api("SUBMIT_LOGBOOK", { month, signatureData: pads.lb.toDataURL() });
                pads.lb.clear();
                showModal(t('submitted'), t('submittedMsg', { id: res.logbook.logbookId, pct: res.logbook.percentage }), "success");
                loadMySubmissions();
            } catch (err) {
                showModal(t('submitError'), err.message, "error");
            } finally {
                setBusy('lb_submit_btn', false);
            }
        }

        async function loadMySubmissions() {
            try {
                const res = await api("GET_MY_SUBMISSIONS");
                mySubmissions = res.submissions;
            } catch (err) {
                mySubmissions = [];
            }
            renderMySubmissions();
        }

        function renderMySubmissions() {
            const tbody = document.getElementById('my_submissions_table_body');
            if (mySubmissions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400 italic">${esc(t('noSubmissions'))}</td></tr>`;
                return;
            }
            tbody.innerHTML = mySubmissions.map(s => `
                <tr class="border-b">
                    <td class="p-2 border">${esc(s.submittedAt)}</td>
                    <td class="p-2 border">${esc(displayMonthLabel(s.month))}</td>
                    <td class="p-2 border">${esc(s.sessionCount)}</td>
                    <td class="p-2 border">${esc(s.clinicalHours)} ${esc(t('hoursUnit'))}</td>
                    <td class="p-2 border font-bold">${esc(s.percentage)}</td>
                    <td class="p-2 border text-center">${safeUrl(s.pdfUrl) ? `<a href="${esc(s.pdfUrl)}" target="_blank" rel="noopener" class="text-blue-600 underline font-bold">${esc(t('viewPdf'))}</a>` : '-'}</td>
                </tr>`).join('');
        }

        // ================= Admin Dashboard =================
        async function loadAdminData() {
            const tbody = document.getElementById('admin_submissions_table_body');
            tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i> ${esc(t('loadingReports'))}</td></tr>`;
            try {
                const res = await api("ADMIN_GET_SUBMISSIONS");
                adminSubmissions = res.submissions;
            } catch (err) {
                adminSubmissions = [];
                tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-red-600">${esc(err.message)}</td></tr>`;
                return;
            }
            populateAdminFilter();
            renderAdminTable();
        }

        /** Fill the month filter from the data (values stay as the stored Malay labels). */
        function populateAdminFilter() {
            const filter = document.getElementById('admin_month_filter');
            const current = filter.value;
            const months = [...new Set(adminSubmissions.map(s => s.month))];
            filter.innerHTML = `<option value="">${esc(t('allMonths'))}</option>` +
                months.map(m => `<option value="${esc(m)}">${esc(displayMonthLabel(m))}</option>`).join('');
            if (months.includes(current)) filter.value = current;
        }

        function renderAdminTable() {
            const month = document.getElementById('admin_month_filter').value;
            const rows = month ? adminSubmissions.filter(s => s.month === month) : adminSubmissions;
            const compliant = rows.filter(s => isCompliant(s.status)).length;

            document.getElementById('admin_total_reports').innerText = rows.length;
            document.getElementById('admin_compliant_count').innerText = compliant;
            document.getElementById('admin_noncompliant_count').innerText = rows.length - compliant;

            const tbody = document.getElementById('admin_submissions_table_body');
            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-6 text-center text-gray-400 italic">${esc(t('noReports'))}</td></tr>`;
                return;
            }
            tbody.innerHTML = rows.map(s => {
                const ok = isCompliant(s.status);
                return `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3 border">${esc(s.submittedAt)}</td>
                    <td class="p-3 border font-mono">${esc(s.userId)}</td>
                    <td class="p-3 border font-bold">${esc(s.officerName)}</td>
                    <td class="p-3 border">${esc(displayMonthLabel(s.month))}</td>
                    <td class="p-3 border">${esc(s.clinicalHours)} ${esc(t('hoursUnit'))} <small class="text-gray-500">(${esc(s.sessionCount)} ${esc(t('sessionsShort'))})</small></td>
                    <td class="p-3 border font-bold ${ok ? 'text-emerald-700' : 'text-red-600'}">${esc(s.percentage)}</td>
                    <td class="p-3 border"><span class="${ok ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'} text-[10px] font-bold px-2 py-0.5 rounded">${esc(ok ? t('compliantShort') : t('notCompliantShort'))}</span></td>
                    <td class="p-3 border text-center">${safeUrl(s.pdfUrl) ? `<a href="${esc(s.pdfUrl)}" target="_blank" rel="noopener" class="text-blue-600 underline text-xs font-bold">${esc(t('viewPdf'))}</a>` : '-'}</td>
                </tr>`;
            }).join('');
        }

        // ================= Modal =================
        function showModal(title, message, type = "success") {
            const modal = document.getElementById('modal_notification');
            const icon = document.getElementById('modal_icon');
            document.getElementById('modal_title').innerText = title;
            document.getElementById('modal_message').innerText = message;

            const styles = {
                success: ["bg-emerald-100 text-emerald-700", "fa-check"],
                error: ["bg-red-100 text-red-700", "fa-exclamation-triangle"],
                warning: ["bg-amber-100 text-amber-700", "fa-info-circle"],
                info: ["bg-blue-100 text-blue-700", "fa-spinner fa-spin"]
            };
            const [cls, ic] = styles[type] || styles.warning;
            icon.className = `w-12 h-12 ${cls} rounded-full flex items-center justify-center mx-auto text-xl`;
            icon.innerHTML = `<i class="fas ${ic}"></i>`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('modal_notification');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }
    </script>
</body>
</html>
